{% extends 'base.html' %}
{% block title %}Edit Task - Task Manager{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card p-4">
        <h2><i class="fas fa-edit"></i> Edit Task</h2>
        <form action="{{ url_for('edit_task', task_id=task.id) }}" method="POST" id="editTaskForm">
            <div class="form-group">
                <label for="title">Task Title *</label>
                <input type="text" id="title" name="title" value="{{ task.title }}" required maxlength="200">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4">{{ task.description or '' }}</textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                        <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input type="date" id="due_date" name="due_date" value="{{ task.due_date if task.due_date else '' }}">
                </div>
            </div>
            
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Pending" {% if task.status == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="Completed" {% if task.status == 'Completed' %}selected{% endif %}>Completed</option>
                    <option value="Overdue" {% if task.status == 'Overdue' %}selected{% endif %}>Overdue</option>
                </select>
            </div>
            
            <div class="form-actions mt-2">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Task</button>
                <a href="{{ url_for('tasks') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
